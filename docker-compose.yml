services:

  registro-estudiantes-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: registro-estudiantes-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:registro_estudiantes
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_H2_CONSOLE_ENABLED=true
      - SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS=true
    networks:
      - jmeter-net

  agente-build:
    build:
     context: ./agente-azure
     dockerfile: build.Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - AZP_POOL=Build
    networks:
      - jmeter-net

  agente-jmeter:
    build:
      context: ./agente-azure
      dockerfile: jmeter.Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - AZP_POOL=JMeter
    depends_on:
      - influxdb
    networks:
      - jmeter-net

  influxdb:
    image: influxdb:1.8
    container_name: influxdb-jmeter
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=jmeter
    networks:
      - jmeter-net

  grafana:
    image: grafana/grafana
    container_name: grafana-jmeter
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/dashboards:/var/lib/grafana/dashboards
    networks:
      - jmeter-net

networks:
  jmeter-net:
