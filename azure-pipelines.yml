trigger:
  - master

pool:
  name: Default

variables:
  projectDir: '.'

stages:

  # BUILD + COVERAGE
  - stage: Build
    displayName: "Build & Tests"
    jobs:
      - job: BuildJob
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - script: mkdir -p $(HOME)/.gradle
            displayName: "Crear carpeta Gradle"

          - task: Cache@2
            inputs:
              key: 'gradle | "$(Agent.OS)" | **/gradle-wrapper.properties'
              restoreKeys: |
                gradle | "$(Agent.OS)"
              path: $(HOME)/.gradle
            displayName: "Cache Gradle"

          - script: java -version
            displayName: "Verificar versión de Java"

          - task: Gradle@3
            displayName: 'Unit + Cucumber + JaCoCo'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              gradleOptions: '-Dfile.encoding=UTF-8 -Xmx3072m'
              tasks: 'clean test acceptanceTest jacocoTestReport'
              publishJUnitResults: true
              testResultsFiles: '**/TEST-*.xml'


  # SONAR + QUALITY GATE
  - stage: Sonar
    displayName: "SonarCloud Analysis"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: SonarJob
        steps:
          - checkout: self
            fetchDepth: 0

          - task: Gradle@3
            displayName: 'Run Sonar Analysis'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              gradleOptions: '-Dfile.encoding=UTF-8 -Xmx3072m'
              tasks: 'sonar'
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)

          - task: SonarCloudPublish@1
            displayName: "Quality Gate"
            inputs:
              pollingTimeoutSec: '300'


  # PERFORMANCE TEST
  - stage: PerformanceTest
    displayName: "Performance Tests (JMeter)"
    dependsOn: Sonar
    condition: succeeded()
    jobs:
      - job: JMeterJob
        steps:
          - checkout: self

          - script: |
              echo "Levantando API..."
              nohup ./gradlew bootRun > app.log 2>&1 &
              sleep 30
            displayName: "Run Spring Boot App"

          - script: |
              echo "Esperando API..."
              for i in {1..10}; do
                curl -f http://localhost:8080/estudiantes && break
                echo "Reintentando..."
                sleep 5
              done
            displayName: "Health Check API"

          - script: mkdir -p src/test/results/html
            displayName: "Preparar carpetas"

          - script: |
              echo "Ejecutando JMeter..."
              jmeter -n \
                -t src/test/stress_test_Registroestudiantes.jmx \
                -l src/test/results/results.jtl
              
              echo "Generando reporte..."
              jmeter \
                -g src/test/results/results.jtl \
                -o src/test/results/html
            displayName: "Run JMeter"

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: 'src/test/results/html'
              artifactName: 'jmeter-report'
              publishLocation: 'Container'
            displayName: "Publicar reporte"


  # PACKAGE
  - stage: Package
    displayName: "Generate Artifact"
    dependsOn: PerformanceTest
    condition: succeeded()
    jobs:
      - job: PackageJob
        steps:
          - checkout: self

          - task: Gradle@3
            displayName: 'Generar JAR'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'bootJar'

          - publish: $(projectDir)/build/libs
            artifact: drop


  # PUBLISH
  - stage: Publish
    displayName: "Publish to Artifact Feed"
    dependsOn: Package
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: PublishJob
        steps:
          - download: current
            artifact: drop

          - task: Gradle@3
            displayName: 'Publicar en Azure Artifacts'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'publish'
            env:
              username: 'ArtifactFeed'
              TOKEN_ARTIFACT_FEED: $(TOKEN_ARTIFACT_FEED)


  # PITEST (SOLO MASTER)
  - stage: MutationTest
    displayName: "Mutation Testing (PIT)"
    dependsOn: Sonar
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: PitestJob
        steps:
          - checkout: self

          - task: Gradle@3
            displayName: 'Run PITEST'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'pitest'