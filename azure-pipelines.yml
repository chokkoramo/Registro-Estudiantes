trigger:
  - master

variables:
  projectDir: '.'

stages:

  # 1. BUILD + TESTS + SONAR (Usa el pool Build)
  - stage: Build
    displayName: "Build, Tests & Sonar"
    jobs:
      - job: BuildJob
        pool:
          name: Build
        steps:
          - checkout: self
            clean: false
            fetchDepth: 0

          - script: mkdir -p $(HOME)/.gradle
            displayName: "Inicializar entorno Gradle"

          - task: Gradle@3
            displayName: 'Build + Tests + Coverage + Sonar'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              gradleOptions: >
                -Dfile.encoding=UTF-8
                -Xmx3072m
                -Dorg.gradle.wrapper.network.timeout=120000
              tasks: >
                clean test acceptanceTest jacocoTestReport sonar
                -Dsonar.qualitygate.wait=true
              publishJUnitResults: true
              testResultsFiles: 'build/test-results/**/TEST-*.xml'
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)

          - task: PublishCodeCoverageResults@1
            displayName: 'Publicar code coverage'
            inputs:
              codeCoverageTool: 'JaCoCo'
              summaryFileLocation: '$(projectDir)/build/reports/jacoco/test/jacocoTestReport.xml'
              classFilesDirectories: '$(projectDir)/build/reports/jacoco/test/html'

  # 2. MUTATION TEST (Usa el pool Build)
  - stage: MutationTest
    displayName: "Mutation Testing"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: PitestJob
        pool:
          name: Build
        steps:
          - checkout: self
            clean: false

          - task: Gradle@3
            displayName: 'Ejecutar PIT'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              gradleOptions: '-Dorg.gradle.wrapper.network.timeout=120000'
              tasks: 'pitest'

  # 3. PACKAGE (Usa el pool Build)
  - stage: Package
    displayName: "Package"
    dependsOn: MutationTest
    condition: succeeded()
    jobs:
      - job: PackageJob
        pool:
          name: Build
        steps:
          - checkout: self
            clean: false

          - task: Gradle@3
            displayName: 'Generar JAR'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              gradleOptions: '-Dorg.gradle.wrapper.network.timeout=120000'
              tasks: 'bootJar'

          - publish: $(projectDir)/build/libs
            artifact: ArtifactRE

  # 4. PUBLISH ARTIFACT (Usa el pool Build)
  - stage: Publish
    displayName: "Publish Artifact"
    dependsOn: Package
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: PublishJob
        pool:
          name: Build
        steps:
          - download: current
            artifact: ArtifactRE

          - checkout: self
            clean: false

          - task: Gradle@3
            displayName: 'Publicar en Artifact Feed'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              gradleOptions: '-Dorg.gradle.wrapper.network.timeout=120000'
              tasks: 'publish'
            env:
              username: 'ArtifactFeed'
              TOKEN_ARTIFACT_FEED: $(TOKEN_ARTIFACT_FEED)

  # 5. PERFORMANCE TEST (pool JMeter)
  - stage: PerformanceTest
    displayName: "Performance Tests"
    dependsOn: Publish
    condition: succeeded()
    jobs:
      - job: JMeterJob
        pool:
          name: JMeter
        steps:
          - checkout: self
            clean: false

          - script: |
              nohup ./gradlew bootRun > app.log 2>&1 &
            displayName: "Levantar API"

          - script: |
              for i in {1..10}; do
                curl -f http://localhost:8080/estudiantes && break
                sleep 5
              done
            displayName: "Health Check"

          - script: |
              rm -rf src/test/results
              mkdir -p src/test/results
            displayName: "Limpiar entorno de JMeter"

          - script: |
              jmeter -n \
                -t src/test/stress_test_Registroestudiantes.jmx \
                -l src/test/results/results.jtl \
                -j src/test/results/jmeter.log \
                -e -o src/test/results/html \
                -Jjmeter.save.saveservice.output_format=csv \
                -Jjmeter.save.saveservice.print_field_names=true \
                -Jlog_level.jmeter=ERROR
            displayName: "Ejecutar JMeter"

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: 'src/test/results/html'
              artifactName: 'jmeter-report'
              publishLocation: 'Container'