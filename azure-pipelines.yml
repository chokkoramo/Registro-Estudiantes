trigger:
  - master

pool:
  name: Default

variables:
  projectDir: '.'

stages:

  # Build: compila, ejecuta pruebas y realiza análisis de SonarCloud
  - stage: Build
    displayName: "Build, Tests & Sonar"
    jobs:
      - job: BuildJob
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - script: mkdir -p $(HOME)/.gradle
            displayName: "Inicializar entorno Gradle"

          # Compilación, pruebas unitarias, pruebas de aceptación, cobertura y análisis de SonarCloud
          - task: Gradle@3
            displayName: 'Build + Tests + Coverage + Sonar'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              gradleOptions: '-Dfile.encoding=UTF-8 -Xmx3072m'
              tasks: 'clean test acceptanceTest jacocoTestReport sonar -Dsonar.qualitygate.wait=true'
              publishJUnitResults: true
              testResultsFiles: '**/TEST-*.xml'
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)

          - task: PublishCodeCoverageResults@2
            displayName: 'Publicar code coverage'
            inputs:
              codeCoverageTool: 'JaCoCo'
              summaryFileLocation: '$(projectDir)/build/reports/jacoco/test/jacocoTestReport.xml'


  # Pruebas de rendimiento usando JMeter sobre la API levantada localmente
  - stage: PerformanceTest
    displayName: "Performance Tests"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: JMeterJob
        steps:
          - checkout: self

          - script: |
              nohup ./gradlew bootRun > app.log 2>&1 &
              sleep 10
            displayName: "Levantar API"

          - script: |
              for i in {1..10}; do
                curl -f http://localhost:8080/estudiantes && break
                sleep 5
              done
            displayName: "Health Check"

          # Preparación de directorio de resultados
          - script: mkdir -p src/test/results/html

          # Ejecución de prueba de carga y generación de reporte
          - script: |
              jmeter -n \
              -t src/test/stress_test_Registroestudiantes.jmx \
              -l src/test/results/results.jtl \
              -j src/test/results/jmeter.log \
              -Jjmeter.save.saveservice.output_format=csv \
              -Jjmeter.save.saveservice.print_field_names=true \
              -Jlog_level.jmeter=ERROR
              
              jmeter \
              -g src/test/results/results.jtl \
              -o src/test/results/html
            displayName: "Ejecutar JMeter"

          # Publicación del reporte generado
          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: 'src/test/results/html'
              artifactName: 'jmeter-report'
              publishLocation: 'Container'


  # Generación del artefacto ejecutable
  - stage: Package
    displayName: "Package"
    dependsOn: PerformanceTest
    condition: succeeded()
    jobs:
      - job: PackageJob
        steps:
          - checkout: self

          - task: Gradle@3
            displayName: 'Generar JAR'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'bootJar'

          - publish: $(projectDir)/build/libs
            artifact: ArtifactRE


  # Publicación del artefacto en Azure Artifacts (solo en master)
  - stage: Publish
    displayName: "Publish Artifact"
    dependsOn: Package
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: PublishJob
        steps:
          - download: current
            artifact: ArtifactRE

          - task: Gradle@3
            displayName: 'Publicar en Artifact Feed'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'publish'
            env:
              username: 'ArtifactFeed'
              TOKEN_ARTIFACT_FEED: $(TOKEN_ARTIFACT_FEED)


  # Pruebas de mutación, se ejecutan solo en master
  - stage: MutationTest
    displayName: "Mutation Testing"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: PitestJob
        steps:
          - checkout: self

          - task: Gradle@3
            displayName: 'Ejecutar PIT'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'pitest'