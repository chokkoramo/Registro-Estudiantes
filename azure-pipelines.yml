trigger:
  - master

pool:
  name: Default

variables:
  projectDir: '.'

stages:
  - stage: Build
    displayName: "Build & Tests"
    jobs:
      - job: BuildJob
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - script: java -version
            displayName: "Verificar versión de Java"

          - task: Gradle@3
            displayName: 'Compilación + Unit Tests'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              gradleOptions: '-Dfile.encoding=UTF-8 -Xmx3072m'
              tasks: 'clean build test'
              publishJUnitResults: true
              testResultsFiles: '**/build/test-results/test/TEST-*.xml'

          - task: Gradle@3
            displayName: 'Cucumber Tests'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'acceptanceTest'
              publishJUnitResults: true
              testResultsFiles: '**/build/test-results/acceptanceTest/TEST-*.xml'

          - task: Gradle@3
            displayName: 'Mutation Tests (Pitest)'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'pitest'

  - stage: PerformanceTest
    displayName: "Performance Tests (JMeter)"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: JMeterJob
        pool:
          name: Default

        steps:
          - checkout: self

          - script: |
              echo "Levantando API..."
              nohup ./gradlew bootRun &
              sleep 25
            displayName: "Run Spring Boot App"

          - script: |
              mkdir -p results/html
            displayName: "Preparar carpetas"

          - script: |
              echo "Descargando JMeter..."
              curl -L https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.zip -o jmeter.zip
              unzip -q jmeter.zip
            displayName: "Instalar JMeter"

          - script: |
              echo "Ejecutando prueba..."
              ./apache-jmeter-5.6.3/bin/jmeter -n \
                -t test/stress_test_Registroestudiantes.jmx \
                -l results/results.jtl

              echo "Generando reporte..."
              ./apache-jmeter-5.6.3/bin/jmeter \
                -g results/results.jtl \
                -o results/html
            displayName: "Run JMeter"

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: 'results/html'
              artifactName: 'jmeter-report'
              publishLocation: 'Container'
            displayName: "Publicar reporte"


  - stage: Package
    displayName: "Generate Artifact"
    dependsOn: PerformanceTest
    condition: succeeded()
    jobs:
      - job: PackageJob
        steps:
          - checkout: self

          - task: Gradle@3
            displayName: 'Generar JAR'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'bootJar'

          - publish: $(projectDir)/build/libs
            artifact: drop


  - stage: Publish
    displayName: "Publish to Artifact Feed"
    dependsOn: Package
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: PublishJob
        steps:
          - download: current
            artifact: drop

          - task: Gradle@3
            displayName: 'Publicar en Azure Artifacts'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'publish'
            env:
              username: 'ArtifactFeed'
              TOKEN_ARTIFACT_FEED: $(TOKEN_ARTIFACT_FEED)