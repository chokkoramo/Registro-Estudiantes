trigger:
  - master

pool:
  name: Default

variables:
  projectDir: '.'

stages:

  # =========================
  # BUILD + TESTS + SONAR
  # =========================
  - stage: Build
    displayName: "Build, Tests & Sonar"
    jobs:
      - job: BuildJob
        steps:
          - checkout: self
            clean: false
            fetchDepth: 0

          - script: mkdir -p $(HOME)/.gradle
            displayName: "Inicializar entorno Gradle"

          - task: Gradle@3
            displayName: 'Build + Tests + Coverage + Sonar'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              gradleOptions: >
                -Dfile.encoding=UTF-8
                -Xmx3072m
                -Dorg.gradle.wrapper.network.timeout=120000
              tasks: >
                clean test acceptanceTest jacocoTestReport sonar
                -Dsonar.qualitygate.wait=true
              publishJUnitResults: true
              testResultsFiles: '**/TEST-*.xml'
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)

          - task: PublishCodeCoverageResults@2
            displayName: 'Publicar code coverage'
            inputs:
              codeCoverageTool: 'JaCoCo'
              summaryFileLocation: 'build/reports/jacoco/test/jacocoTestReport.xml'
              reportDirectory: 'build/reports/jacoco/test/html'
              pathToSources: '$(System.DefaultWorkingDirectory)'

  # =========================
  # PERFORMANCE TEST (JMeter)
  # =========================
  - stage: PerformanceTest
    displayName: "Performance Tests"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: JMeterJob
        steps:
          - checkout: self
            clean: false

          - script: |
              nohup ./gradlew bootRun > app.log 2>&1 &
              sleep 10
            displayName: "Levantar API"

          - script: |
              for i in {1..5}; do
                curl -f http://localhost:8080/estudiantes && break
                sleep 5
              done
            displayName: "Health Check"

          - script: mkdir -p src/test/results/html

          - script: |
              jmeter -n \
                -t src/test/stress_test_Registroestudiantes.jmx \
                -l src/test/results/results.jtl \
                -j src/test/results/jmeter.log \
                -Jjmeter.save.saveservice.output_format=csv \
                -Jjmeter.save.saveservice.print_field_names=true \
                -Jlog_level.jmeter=ERROR
              
              jmeter \
                -g src/test/results/results.jtl \
                -o src/test/results/html
            displayName: "Ejecutar JMeter"

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: 'src/test/results/html'
              artifactName: 'jmeter-report'
              publishLocation: 'Container'

  # =========================
  # PACKAGE
  # =========================
  - stage: Package
    displayName: "Package"
    dependsOn: PerformanceTest
    condition: succeeded()
    jobs:
      - job: PackageJob
        steps:
          - checkout: self
            clean: false

          - task: Gradle@3
            displayName: 'Generar JAR'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              gradleOptions: '-Dorg.gradle.wrapper.network.timeout=120000'
              tasks: 'bootJar'

          - publish: $(projectDir)/build/libs
            artifact: ArtifactRE

  # =========================
  # PUBLISH ARTIFACT
  # =========================
  - stage: Publish
    displayName: "Publish Artifact"
    dependsOn: Package
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: PublishJob
        steps:
          - download: current
            artifact: ArtifactRE

          - checkout: self
            clean: false

          - task: Gradle@3
            displayName: 'Publicar en Artifact Feed'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              gradleOptions: '-Dorg.gradle.wrapper.network.timeout=120000'
              tasks: 'publish'
            env:
              username: 'ArtifactFeed'
              TOKEN_ARTIFACT_FEED: $(TOKEN_ARTIFACT_FEED)

  # =========================
  # MUTATION TEST (PITEST)
  # =========================
  - stage: MutationTest
    displayName: "Mutation Testing"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: PitestJob
        steps:
          - checkout: self
            clean: false

          - task: Gradle@3
            displayName: 'Ejecutar PIT'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              gradleOptions: '-Dorg.gradle.wrapper.network.timeout=120000'
              tasks: 'pitest'