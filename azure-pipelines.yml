trigger:
  - master

pool:
  name: Default

variables:
  projectDir: '.'

stages:

  # Build: compila, ejecuta pruebas y realiza análisis de SonarCloud
  - stage: Build
    displayName: "Build, Tests & Sonar"
    jobs:
      - job: BuildJob
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - script: mkdir -p $(HOME)/.gradle
            displayName: "Inicializar entorno Gradle"

          - task: Cache@2
            inputs:
              key: 'gradle | "$(Agent.OS)" | **/gradle-wrapper.properties'
              restoreKeys: |
                gradle | "$(Agent.OS)"
              path: $(HOME)/.gradle

          # Validación de entorno Java
          - script: java -version
            displayName: "Verificar Java"

          # Configuración de SonarCloud antes del build
          - task: SonarCloudPrepare@1
            inputs:
              SonarCloud: 'SonarCloudConnection'  # Service Connection configurado en Azure
              organization: 'chokkoramo'
              scannerMode: 'Other'
              configMode: 'manual'
              cliProjectKey: 'chokkoramo_Registro-Estudiantes'
              cliProjectName: 'RegistroEstudiantes'
              extraProperties: |
                sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

          # Compilación, pruebas unitarias, pruebas de aceptación y generación de cobertura
          - task: Gradle@3
            displayName: 'Build + Tests + Coverage'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              gradleOptions: '-Dfile.encoding=UTF-8 -Xmx3072m'
              tasks: 'clean test acceptanceTest jacocoTestReport'
              publishJUnitResults: true
              testResultsFiles: '**/TEST-*.xml'

          # Ejecución del análisis en SonarCloud
          - task: SonarCloudAnalyze@1

          # Espera el resultado del Quality Gate y falla el pipeline si no se cumple
          - task: SonarCloudPublish@1
            displayName: "Quality Gate"
            inputs:
              pollingTimeoutSec: '300'


  # Pruebas de rendimiento usando JMeter sobre la API levantada localmente
  - stage: PerformanceTest
    displayName: "Performance Tests"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: JMeterJob
        steps:
          - checkout: self

          - script: |
              nohup ./gradlew bootRun > app.log 2>&1 &
              sleep 30
            displayName: "Levantar API"

          - script: |
              for i in {1..10}; do
                curl -f http://localhost:8080/estudiantes && break
                sleep 5
              done
            displayName: "Health Check"

          # Preparación de directorio de resultados
          - script: mkdir -p src/test/results/html

          # Ejecución de prueba de carga y generación de reporte
          - script: |
              jmeter -n \
                -t src/test/stress_test_Registroestudiantes.jmx \
                -l src/test/results/results.jtl

              jmeter \
                -g src/test/results/results.jtl \
                -o src/test/results/html
            displayName: "Ejecutar JMeter"

          # Publicación del reporte generado
          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: 'src/test/results/html'
              artifactName: 'jmeter-report'
              publishLocation: 'Container'


  # Generación del artefacto ejecutable
  - stage: Package
    displayName: "Package"
    dependsOn: PerformanceTest
    condition: succeeded()
    jobs:
      - job: PackageJob
        steps:
          - checkout: self

          - task: Gradle@3
            displayName: 'Generar JAR'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'bootJar'

          - publish: $(projectDir)/build/libs
            artifact: drop


  # Publicación del artefacto en Azure Artifacts (solo en master)
  - stage: Publish
    displayName: "Publish Artifact"
    dependsOn: Package
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: PublishJob
        steps:
          - download: current
            artifact: drop

          - task: Gradle@3
            displayName: 'Publicar en Artifact Feed'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'publish'
            env:
              username: 'ArtifactFeed'
              TOKEN_ARTIFACT_FEED: $(TOKEN_ARTIFACT_FEED)


  # Pruebas de mutación (costosas), se ejecutan solo en master
  - stage: MutationTest
    displayName: "Mutation Testing"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: PitestJob
        steps:
          - checkout: self

          - task: Gradle@3
            displayName: 'Ejecutar PIT'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'pitest'