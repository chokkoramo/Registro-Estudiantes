trigger:
  - master

pool:
  name: Default

steps:
  - script: chmod +x gradlew
    displayName: 'Dar permisos a Gradle'

  - script: ./gradlew clean build
    displayName: 'Build proyecto'

  - script: ./gradlew pitest
    displayName: 'Prueba de mutacion (PIT)'

  - script: ./gradlew sonar
    displayName: 'Análisis en Sonar'
    env:
      SONAR_TOKEN: $(SONAR_TOKEN)