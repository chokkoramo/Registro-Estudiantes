trigger:
  - master

pool:
  name: Default

variables:
  projectDir: '.'

steps:
  - checkout: self
    displayName: "Clonar repositorio"
    clean: true
    fetchDepth: 0

  - script: java -version
    displayName: "Verificar versión de Java"

  - task: Gradle@3
    displayName: 'Compilación y pruebas unitarias'
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8 -Xmx3072m'
      tasks: 'clean build test'
      publishJUnitResults: true
      testResultsFiles: '**/build/test-results/test/TEST-*.xml'

  - task: Gradle@3
    displayName: 'Pruebas de aceptación (Cucumber)'
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      tasks: 'acceptanceTest'
      publishJUnitResults: true
      testResultsFiles: '**/build/test-results/acceptanceTest/TEST-*.xml'

  - task: Gradle@3
    displayName: 'Pruebas de mutación (Pitest)'
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      tasks: 'pitest'

  - task: Gradle@3
    displayName: 'Análisis de calidad (SonarQube)'
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      tasks: 'sonar'
    env:
      SONAR_TOKEN: $(SONAR_TOKEN)
      SONAR_HOST_URL: 'http://sonarqube:9000'

  - task: Gradle@3
    displayName: 'Publicar artefacto en Azure Artifacts'
    condition: succeeded()
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      tasks: 'publish'
    env:
      ArtifactFeedUsername: 'Chokkoramo'
      ORG_GRADLE_PROJECT_ArtifactFeedPassword: $(SECRET_TOKEN)