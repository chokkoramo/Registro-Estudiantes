trigger:
  - master

variables:
  projectDir: '.'

stages:

  # =========================
  # 1. BUILD + TESTS + SONAR
  # =========================
  - stage: Build
    displayName: "Build, Tests & Sonar"
    jobs:
      - job: BuildJob
        pool:
          name: Build
        steps:

          - checkout: self
            clean: false
            fetchDepth: 0

          - script: mkdir -p $(HOME)/.gradle
            displayName: "Inicializar entorno Gradle"

          - task: Gradle@3
            displayName: 'Build + Unit Tests + Coverage + Sonar'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              gradleOptions: >
                -Dfile.encoding=UTF-8
                -Xmx3072m
                -Dorg.gradle.daemon=false
                -Dorg.gradle.parallel=true
                -Dorg.gradle.configureondemand=true
              tasks: >
                clean test jacocoTestReport sonar
                -Dsonar.qualitygate.wait=false
                -Dsonar.exclusions=frontend/**
              publishJUnitResults: true
              testResultsFiles: 'build/test-results/test/TEST-*.xml'
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)

          - task: PublishCodeCoverageResults@1
            displayName: 'Publicar code coverage'
            inputs:
              codeCoverageTool: 'JaCoCo'
              summaryFileLocation: '$(projectDir)/build/reports/jacoco/test/jacocoTestReport.xml'

  # =========================
  # 2. ACCEPTANCE TEST
  # =========================
  - stage: AcceptanceTest
    displayName: "Acceptance Tests"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: AcceptanceJob
        pool:
          name: Build
        steps:

          - checkout: self
            clean: false

          - task: Gradle@3
            displayName: 'Run Acceptance Tests'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'acceptanceTest'
              publishJUnitResults: false

          - task: PublishTestResults@2
            displayName: "Publish Acceptance Tests"
            inputs:
              testResultsFiles: 'build/test-results/acceptanceTest/TEST-*.xml'
              testRunTitle: "Acceptance Tests"

  # =========================
  # 3. MUTATION TEST
  # =========================
  - stage: MutationTest
    displayName: "Mutation Testing"
    dependsOn: AcceptanceTest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: PitestJob
        pool:
          name: Build
        steps:
          - checkout: self
            clean: false

          - task: Gradle@3
            displayName: 'Ejecutar PIT'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'pitest'

  # =========================
  # 4. PACKAGE
  # =========================
  - stage: Package
    displayName: "Package"
    dependsOn: MutationTest
    condition: succeeded()
    jobs:
      - job: PackageJob
        pool:
          name: Build
        steps:

          - checkout: self
            clean: false

          - task: Gradle@3
            displayName: 'Generar JAR'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'bootJar -x test -x acceptanceTest'

          - publish: $(projectDir)/build/libs
            artifact: ArtifactRE

  # =========================
  # 5. PUBLISH
  # =========================
  - stage: Publish
    displayName: "Publish Artifact"
    dependsOn: Package
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: PublishJob
        pool:
          name: Build
        steps:

          - download: current
            artifact: ArtifactRE

          - checkout: self
            clean: false

          - task: Gradle@3
            displayName: 'Publicar en Artifact Feed'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'publish -x test -x acceptanceTest'
            env:
              username: 'ArtifactFeed'
              TOKEN_ARTIFACT_FEED: $(TOKEN_ARTIFACT_FEED)

  # =========================
  # 6. PERFORMANCE TEST
  # =========================
  - stage: PerformanceTest
    displayName: "Performance Tests"
    dependsOn: Publish
    condition: succeeded()
    jobs:
      - job: JMeterJob
        pool:
          name: JMeter
        steps:

          - checkout: self
            clean: false

          - script: |
              for i in {1..10}; do
                curl -f https://registro-estudiantes.onrender.com/api/estudiantes && exit 0
                sleep 4
              done
              exit 1
            displayName: "Health Check"

          - script: |
              rm -rf src/test/results
              mkdir -p src/test/results
            displayName: "Preparar JMeter"

          - script: |
              jmeter -n \
                -t src/test/stress_test_Registroestudiantes.jmx \
                -l src/test/results/results.jtl \
                -e -o src/test/results/html
            displayName: "Ejecutar JMeter"

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: 'src/test/results/html'
              artifactName: 'jmeter-report'