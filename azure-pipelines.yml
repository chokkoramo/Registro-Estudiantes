trigger:
  - master

pool:
  name: Default

variables:
  projectDir: '.'

stages:
  - stage: Build
    displayName: "Build & Tests"
    jobs:
      - job: BuildJob
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - script: java -version
            displayName: "Verificar versión de Java"

          - task: Gradle@3
            displayName: 'Compilación + Unit Tests'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              gradleOptions: '-Dfile.encoding=UTF-8 -Xmx3072m'
              tasks: 'clean build test'
              publishJUnitResults: true
              testResultsFiles: '**/TEST-*.xml'

          - task: Gradle@3
            displayName: 'Cucumber Tests'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'acceptanceTest'
              publishJUnitResults: true
              testResultsFiles: '**/TEST-*.xml'

          - task: Gradle@3
            displayName: 'Mutation Tests (Pitest)'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'pitest'

  - stage: PerformanceTest
    displayName: "Performance Tests (JMeter)"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: JMeterJob
        steps:
          - checkout: self

          - script: |
              echo "Levantando API..."
              nohup ./gradlew bootRun > app.log 2>&1 &
              sleep 30
            displayName: "Run Spring Boot App"

          - script: |
              echo "Esperando API..."
              for i in {1..10}; do
                curl -f http://localhost:8080/estudiantes && break
                echo "Reintentando..."
                sleep 5
              done
            displayName: "Health Check API"

          - script: |
              mkdir -p src/test/results/html
            displayName: "Preparar carpetas"

          - script: |
              echo "Ejecutando prueba con JMeter instalado..."
              jmeter -n \
                -t src/test/stress_test_Registroestudiantes.jmx \
                -l src/test/results/results.jtl

              echo "Generando reporte..."
              jmeter \
                -g src/test/results/results.jtl \
                -o src/test/results/html
            displayName: "Run JMeter"

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: 'results/html'
              artifactName: 'jmeter-report'
              publishLocation: 'Container'
            displayName: "Publicar reporte"

  - stage: Package
    displayName: "Generate Artifact"
    dependsOn: PerformanceTest
    condition: succeeded()
    jobs:
      - job: PackageJob
        steps:
          - checkout: self

          - task: Gradle@3
            displayName: 'Generar JAR'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'bootJar'

          - publish: $(projectDir)/build/libs
            artifact: drop

  - stage: Publish
    displayName: "Publish to Artifact Feed"
    dependsOn: Package
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: PublishJob
        steps:
          - download: current
            artifact: drop

          - task: Gradle@3
            displayName: 'Publicar en Azure Artifacts'
            inputs:
              workingDirectory: '$(projectDir)'
              gradleWrapperFile: '$(projectDir)/gradlew'
              tasks: 'publish'
            env:
              username: 'ArtifactFeed'
              TOKEN_ARTIFACT_FEED: $(TOKEN_ARTIFACT_FEED)